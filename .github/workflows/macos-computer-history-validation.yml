name: macOS Computer History validation

on:
  push:
    branches:
      - "feature/windows-history-native-core"
      - "fix/**"
  pull_request:
    paths:
      - ".github/workflows/macos-computer-history-validation.yml"
      - "App/memmy-agent/**"
      - "App/backend/local-api-contracts/**"
      - "App/frontend/desktop/**"
      - "App/shell/desktop/**"
      - "scripts/internal/mac/build-computer-history-helpers.sh"
      - "scripts/internal/mac/build-dmg.sh"
      - "scripts/internal/shared/validate-computer-history.mjs"
      - "tests/computer-history*"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      MEMMY_LEGAL_CN_BASE_URL: https://memmy.cn
      MEMMY_LEGAL_INTL_BASE_URL: https://memmy.bot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix App/memmy-agent
      - name: Build production native helpers for Apple Silicon and Intel
        run: |
          mkdir -p .history-ci/helpers
          cp -R App/memmy-agent/src/tools/computer-history/mac/. .history-ci/helpers/
          bash scripts/internal/mac/build-computer-history-helpers.sh .history-ci/helpers arm64
          bash scripts/internal/mac/build-computer-history-helpers.sh .history-ci/helpers x64
      - name: Run History lifecycle, UI and packaging checks
        run: node scripts/internal/shared/validate-computer-history.mjs --report-dir "$GITHUB_WORKSPACE/.history-ci/regression"
      - name: Record validation scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job compiles the retained History support helpers for both macOS architectures and checks History lifecycle, event capture, UI and packaging.
          OS permission dialogs, real desktop collection and a signed installed application require manual Mac acceptance. The job does not claim those checks passed.
          EOF
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-computer-history-validation
          path: .history-ci/regression/**
          retention-days: 7
          if-no-files-found: warn
